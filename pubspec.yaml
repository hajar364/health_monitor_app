name: health_monitor_app
description: HealthGuard — Détection de chute et appel SOS IoT

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP communication with ESP32
  http: ^1.2.0

  # Date formatting for timestamps
  intl: ^0.18.1

  # State Management
  provider: ^6.0.0

  # Real-time Charts
  fl_chart: ^0.65.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Notifications & Alerts (désactivé temporairement - problème compilation)
  # flutter_local_notifications: ^14.0.0

  # WiFi Connectivity
  connectivity_plus: ^5.0.0

  # Emergency Calls
  url_launcher: ^6.2.0
  permission_handler: ^11.3.0
  flutter_phone_direct_caller: ^2.1.1

  # Utilities
  uuid: ^4.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#1565C0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/